<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yard SQL · Detetives de Dados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9dfc8;--bg2:#f4ecd8;--card:#faf4e4;--ink:#2b2218;--muted:#7b6a53;--line:#cfbf9d;
  --accent:#a3361f;--accent-ink:#fff7ea;--gold:#9a6b12;--ok:#2f6b3a;--err:#b3261e;--code:#fbf7ec;
  --l0:#3f7d4e;--l1:#b07a1a;--l2:#a3361f;--l3:#5b3a8c;

  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0d0e11;--bg2:#13151a;--card:#171a20;--ink:#e6e1d3;--muted:#8d887a;--line:#2a2e37;--accent:#e2a43a;--accent-ink:#1a1303;--gold:#e2a43a;--ok:#5fb877;--err:#ef6a60;--code:#0b0c0f;--l0:#5fb877;--l1:#e2a43a;--l2:#ef6a60;--l3:#a98bf0}
}
:root[data-theme="dark"]{--bg:#0d0e11;--bg2:#13151a;--card:#171a20;--ink:#e6e1d3;--muted:#8d887a;--line:#2a2e37;--accent:#e2a43a;--accent-ink:#1a1303;--gold:#e2a43a;--ok:#5fb877;--err:#ef6a60;--code:#0b0c0f;--l0:#5fb877;--l1:#e2a43a;--l2:#ef6a60;--l3:#a98bf0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;min-height:100%;
  background-image:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 40%)}
code,pre,.sql,.input,.col,.tname{font-family:var(--mono)}
h1,h2,h3{font-family:var(--head);font-weight:400;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-size:1.25rem;letter-spacing:.04em;cursor:pointer;background:none;border:0;padding:0}
.brand i{font-style:normal;color:var(--accent)}
.brand small{display:block;font-family:var(--body);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats{margin-left:auto;min-width:130px;max-width:230px;flex:1}
#rankName{font-family:var(--head);font-size:.95rem;color:var(--gold)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
#xpTxt{font-size:.7rem;color:var(--muted);font-family:var(--mono)}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem}
.iconbtn:hover{border-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
.hero{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:26px 24px;margin-bottom:18px;overflow:hidden}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:.02em}
.hero p{max-width:62ch;color:var(--muted);margin:.6rem 0}
.hero code{background:var(--code);padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink)}
.herostats{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.herostats b{color:var(--ink)}
.stamp{position:absolute;right:18px;top:16px;border:3px double var(--accent);color:var(--accent);font-family:var(--head);padding:2px 10px;transform:rotate(6deg);letter-spacing:.2em;font-size:.8rem;opacity:.8}
.stamp.ok{position:static;display:inline-block;color:var(--ok);border-color:var(--ok);margin-bottom:10px;transform:rotate(-3deg)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:.85rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:8px;min-width:200px;font:inherit}
.lvl{margin-top:26px}
.lvl h2{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.lvl h2 small{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-left:auto}
.dot{width:12px;height:12px;border-radius:50%;background:var(--lc)}
.l0{--lc:var(--l0)}.l1{--lc:var(--l1)}.l2{--lc:var(--l2)}.l3{--lc:var(--l3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:12px}
.card{text-align:left;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--lc);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card.done{opacity:.78}
.cardtop{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.card .xp{color:var(--gold)}
.card h3{font-size:1.15rem}
.card p{margin:0;font-size:.85rem;color:var(--muted);flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-family:var(--mono);color:var(--muted)}
.tag.yard{color:var(--accent);border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.foot{margin-top:40px;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}
.linkbtn:hover{color:var(--accent)}
/* caso */
.casebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lvlbadge{font-family:var(--mono);font-size:.75rem;border:1px solid var(--lc);color:var(--lc);border-radius:4px;padding:2px 9px}
.caselayout{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:980px){.caselayout{grid-template-columns:minmax(330px,420px) 1fr;align-items:start}.left{position:sticky;top:calc(70px + env(safe-area-inset-top,0px));max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}}
.left,.right{display:flex;flex-direction:column;gap:14px;min-width:0}
.casehead{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--lc);border-radius:6px;padding:14px}
.casehead h1{font-size:1.8rem;margin:2px 0 8px}
.num{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px}
.panel h3{font-size:1.1rem;margin-bottom:8px;display:flex;align-items:baseline;gap:10px}
.panel h3 small{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-left:auto}
.panel p{margin:.4rem 0}
.goal{padding:8px 10px;background:var(--bg2);border-left:3px solid var(--accent);border-radius:3px}
.note{font-size:.8rem;color:var(--muted)}
.tbl{border-top:1px dashed var(--line);padding:9px 0}
.tbl:first-of-type{border-top:0}
.tblhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tname{font-weight:500;color:var(--accent);font-size:.95rem}
.cnt{font-size:.72rem;color:var(--muted);font-family:var(--mono)}
.mini{margin-left:auto;font-size:.72rem;background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:2px 8px}
.mini:hover{border-color:var(--accent)}
.tdesc{font-size:.8rem;color:var(--muted);margin:3px 0 6px!important}
.cols{display:flex;flex-wrap:wrap;gap:4px}
.col{font-size:.72rem;background:var(--code);border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--ink)}
.col:hover{border-color:var(--accent);color:var(--accent)}
.sql,.input,.notes{width:100%;background:var(--code);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:.88rem;line-height:1.5}

.sql:focus,.input:focus,.notes:focus,.search:focus{outline:2px solid var(--accent);outline-offset:0}
.notes{font-family:var(--body);min-height:90px;resize:vertical}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.input{flex:1;min-width:160px;font-family:var(--body)}
.btn{border:1px solid var(--line);background:var(--bg2);border-radius:7px;padding:8px 16px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

.btn.ghost{background:transparent}
.hints{padding-left:18px;margin:6px 0}
.hints pre{margin:0 0 8px;white-space:pre-wrap;font-size:.8rem;background:var(--code);padding:6px 8px;border-radius:5px;border:1px solid var(--line)}
.results{min-height:60px}
.rescount{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-bottom:6px}
.tablewrap{overflow-x:auto;max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:.8rem}
th,td{padding:5px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--bg2);color:var(--gold);font-weight:500}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--bg2) 55%,transparent)}
.null{color:var(--muted);font-style:italic}
.err{border-left:4px solid var(--err);background:color-mix(in srgb,var(--err) 10%,transparent);padding:10px 12px;border-radius:4px;font-size:.88rem}
.accmsg{margin-top:8px;font-size:.88rem;min-height:1.2em}
.accmsg.bad{color:var(--err)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:8px;max-width:560px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.modal h2{font-size:1.6rem;margin-bottom:8px}
.code{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:.8rem;overflow:auto;margin:6px 0 0;white-space:pre}
.reflist{display:grid;gap:8px;margin:10px 0}
.reflist div{display:flex;flex-direction:column;gap:2px;font-size:.85rem}
.reflist code{background:var(--code);border:1px solid var(--line);padding:3px 8px;border-radius:4px;font-size:.78rem;overflow-x:auto}
@media (max-width:560px){.stats{max-width:none}.brand small{display:none}.hero{padding:20px 16px}.stamp{display:none}}

.sub{font-family:var(--head);color:var(--accent);margin:2px 0 0!important;letter-spacing:.12em;text-transform:uppercase;font-size:.85rem}
.btn.sm{padding:6px 12px;font-size:.85rem;white-space:nowrap}
.userchip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 12px 3px 4px}
.userchip:hover{border-color:var(--accent)}
.userchip .av{width:28px;height:28px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:1rem}
.userchip .nick{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem}
.guestbar{margin-top:12px;padding:9px 12px;background:var(--bg2);border-left:3px solid var(--gold);border-radius:3px;font-size:.88rem}
.guestbar.warn{border-color:var(--err)}
.loading{text-align:center;padding:80px 0;color:var(--muted)}
.authtabs{display:flex;gap:6px;margin-bottom:12px}
.authtabs button{flex:1;padding:8px;border:1px solid var(--line);background:var(--bg2);border-radius:7px}
.authtabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.form{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.form label,.lbl{display:flex;flex-direction:column;gap:4px;font-size:.85rem}
.form small{color:var(--muted)}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px}
.avbtn{font-size:1.4rem;padding:6px 0;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.avbtn.on{border-color:var(--accent);outline:2px solid var(--accent)}
.okmsg{color:var(--ok)}
table.board td:first-child,table.board th:first-child{width:48px}
table.board tr.me{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.iconbtn{white-space:nowrap}
@media (max-width:560px){.userchip .nick{display:none}.userchip{padding:3px}.top{gap:8px;padding:8px 10px}.stats{min-width:90px}}
</style>

<header class="top">
  <button class="brand" onclick="renderHome()" aria-label="Início"><i>⌕</i><span>Yard SQL<small>Detetives de dados</small></span></button>
  <div class="stats"><div id="rankName">Estagiário</div><div class="bar"><i id="xpBar"></i></div><div id="xpTxt"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ================= MOTOR SQL (somente SELECT, sem eval) ================= */
class SqlError extends Error {}
const AGG = new Set(['COUNT', 'SUM', 'AVG', 'MIN', 'MAX']);
const RESERVED = new Set(['SELECT','FROM','WHERE','GROUP','ORDER','BY','HAVING','LIMIT','OFFSET','JOIN','INNER','LEFT','RIGHT','OUTER','CROSS','ON','AS','AND','OR','NOT','IN','IS','NULL','LIKE','BETWEEN','DISTINCT','ASC','DESC','CASE','WHEN','THEN','ELSE','END','EXISTS','UNION','ALL']);

function tokenize(sql) {
  sql = sql.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"');
  const toks = []; let i = 0; const n = sql.length;
  while (i < n) {
    const ch = sql[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (ch === '-' && sql[i + 1] === '-') { while (i < n && sql[i] !== '\n') i++; continue; }
    if (ch === '/' && sql[i + 1] === '*') { const e = sql.indexOf('*/', i + 2); i = e < 0 ? n : e + 2; continue; }
    const st = i;
    if (ch === "'") {
      let s = ''; i++;
      for (;;) {
        if (i >= n) throw new SqlError('Um texto entre aspas simples não foi fechado.');
        if (sql[i] === "'") { if (sql[i + 1] === "'") { s += "'"; i += 2; continue; } i++; break; }
        s += sql[i++];
      }
      toks.push({ t: 'str', v: s, raw: sql.slice(st, i), s: st, e: i }); continue;
    }
    if (ch === '"' || ch === '`') {
      const e = sql.indexOf(ch, i + 1);
      if (e < 0) throw new SqlError('Um identificador entre aspas não foi fechado.');
      const v = sql.slice(i + 1, e); i = e + 1;
      toks.push({ t: 'id', v, l: v.toLowerCase(), u: '', raw: sql.slice(st, i), s: st, e: i }); continue;
    }
    if (/[0-9]/.test(ch) || (ch === '.' && /[0-9]/.test(sql[i + 1] || ''))) {
      let j = i; while (j < n && /[0-9.]/.test(sql[j])) j++;
      toks.push({ t: 'num', v: parseFloat(sql.slice(i, j)), raw: sql.slice(i, j), s: i, e: j }); i = j; continue;
    }
    if (/[A-Za-z_\u00C0-\u024F]/.test(ch)) {
      let j = i; while (j < n && /[A-Za-z0-9_\u00C0-\u024F]/.test(sql[j])) j++;
      const v = sql.slice(i, j);
      toks.push({ t: 'id', v, l: v.toLowerCase(), u: v.toUpperCase(), raw: v, s: i, e: j }); i = j; continue;
    }
    const two = sql.slice(i, i + 2);
    if (['<=', '>=', '<>', '!=', '||', '=='].includes(two)) { toks.push({ t: 'op', v: two, raw: two, s: i, e: i + 2 }); i += 2; continue; }
    if ('=<>+-*/%(),.;'.includes(ch)) { toks.push({ t: 'op', v: ch, raw: ch, s: i, e: i + 1 }); i++; continue; }
    throw new SqlError(`Caractere inesperado: "${ch}"`);
  }
  toks.push({ t: 'eof', raw: '', s: n, e: n });
  return toks;
}

class Parser {
  constructor(sql) { this.sql = sql; this.t = tokenize(sql); this.i = 0; }
  peek(o = 0) { return this.t[Math.min(this.i + o, this.t.length - 1)]; }
  isKw(k, o = 0) { const x = this.peek(o); return x.t === 'id' && x.u === k; }
  eatKw(k) { if (this.isKw(k)) { this.i++; return true; } return false; }
  expectKw(k) { if (!this.eatKw(k)) this.err(`esperava ${k}`); }
  isOp(v, o = 0) { const x = this.peek(o); return x.t === 'op' && x.v === v; }
  eatOp(v) { if (this.isOp(v)) { this.i++; return true; } return false; }
  expectOp(v) { if (!this.eatOp(v)) this.err(`esperava "${v}"`); }
  err(msg) { const x = this.peek(); throw new SqlError(`Erro de sintaxe: ${msg} (perto de ${x.t === 'eof' ? 'o fim da consulta' : '"' + x.raw + '"'}).`); }
  ident() {
    const x = this.peek();
    if (x.t !== 'id') this.err('esperava um nome');
    this.i++; return x;
  }
  canAlias() { const x = this.peek(); return x.t === 'id' && (x.u === '' || !RESERVED.has(x.u)); }

  parseQuery() {
    const q = this.parseSelect();
    while (this.eatOp(';'));
    if (this.peek().t !== 'eof') this.err('texto inesperado depois da consulta');
    return q;
  }
  parseSelect() {
    this.expectKw('SELECT');
    const distinct = this.eatKw('DISTINCT'); if (!distinct) this.eatKw('ALL');
    const items = [];
    do { items.push(this.parseItem()); } while (this.eatOp(','));
    let from = null; const joins = [];
    if (this.eatKw('FROM')) {
      from = this.parseSource();
      for (;;) {
        if (this.eatOp(',')) { joins.push({ type: 'cross', src: this.parseSource() }); continue; }
        let type = null;
        if (this.isKw('JOIN')) { this.i++; type = 'inner'; }
        else if (this.isKw('INNER') && this.isKw('JOIN', 1)) { this.i += 2; type = 'inner'; }
        else if (this.isKw('LEFT')) { this.i++; this.eatKw('OUTER'); this.expectKw('JOIN'); type = 'left'; }
        else if (this.isKw('CROSS') && this.isKw('JOIN', 1)) { this.i += 2; type = 'cross'; }
        else if (this.isKw('RIGHT')) throw new SqlError('RIGHT JOIN não é suportado aqui. Troque a ordem das tabelas e use LEFT JOIN.');
        else break;
        const src = this.parseSource(); let on = null;
        if (type !== 'cross') { this.expectKw('ON'); on = this.parseExpr(); }
        joins.push({ type, src, on });
      }
    }
    let where = null, group = [], having = null, order = [], limit = null, offset = null;
    if (this.eatKw('WHERE')) where = this.parseExpr();
    if (this.isKw('GROUP')) { this.i++; this.expectKw('BY'); do { group.push(this.parseExpr()); } while (this.eatOp(',')); }
    if (this.eatKw('HAVING')) having = this.parseExpr();
    if (this.isKw('ORDER')) {
      this.i++; this.expectKw('BY');
      do { const e = this.parseExpr(); let desc = false; if (this.eatKw('DESC')) desc = true; else this.eatKw('ASC'); order.push({ e, desc }); } while (this.eatOp(','));
    }
    if (this.eatKw('LIMIT')) { limit = this.parseAdd(); if (this.eatKw('OFFSET')) offset = this.parseAdd(); else if (this.eatOp(',')) { offset = limit; limit = this.parseAdd(); } }
    else if (this.eatKw('OFFSET')) offset = this.parseAdd();
    if (this.isKw('UNION')) throw new SqlError('UNION não é suportado nesta delegacia. Tente JOIN ou subconsultas.');
    return { k: 'select', distinct, items, from, joins, where, group, having, order, limit, offset };
  }
  parseItem() {
    if (this.isOp('*')) { this.i++; return { star: true }; }
    if (this.peek().t === 'id' && this.isOp('.', 1) && this.isOp('*', 2)) { const t = this.peek().l; this.i += 3; return { star: true, table: t }; }
    const s = this.peek().s;
    const expr = this.parseExpr();

        <section class="panel"><h3>Resultado</h3><div id="results" class="results"><p class="note">Execute uma consulta para ver os resultados aqui.</p></div></section>
        <section class="panel accuse"><h3>⚖ Acusação formal</h3><p class="note">Digite o nome completo do culpado. Cada acusação errada reduz o XP em 20%.</p>
          <div class="row"><input id="accuse" class="input" type="text" placeholder="Nome e sobrenome" autocomplete="off"><button class="btn danger" id="btnAccuse">Acusar</button></div>
          <div id="accMsg" class="accmsg" role="status"></div></section>
      </div>
    </div>
  </div>`;
  renderHints();
}
function renderHints() {
  const c = state.c, n = state.hintTexts.length;
  $('#hintsBox').innerHTML = n ? '<ol class="hints">' + state.hintTexts.map(h => `<li><pre>${esc(h)}</pre></li>`).join('') + '</ol>' : '<p class="note">Sem dicas por enquanto. Cada dica custa um pouco de XP.</p>';
  const b = $('#btnHint');
  if (n >= 3) b.style.display = 'none'; else { b.style.display = ''; b.disabled = false; b.textContent = `Pedir dica ${n + 1}/3 (−${HINT_COST[n] * 100}% XP${n === 2 ? ', revela a solução' : ''})`; }
  $('#xpPot').textContent = `XP possível: ${Math.round(c.xp * potential())}`;
}
async function askHint() {
  const b = $('#btnHint'); b.disabled = true;
  try { const r = await api('hint', { case_id: state.c.id, n: state.hintTexts.length + 1 }); state.hintTexts.push(r.text); }
  catch (e) { alert(e.message); }
  renderHints();
}
function fmt(v) {
  if (v === null || v === undefined) return '<span class="null">NULL</span>';
  if (typeof v === 'boolean') return v ? '1' : '0';
  if (typeof v === 'number' && !Number.isInteger(v)) return String(Math.round(v * 10000) / 10000);
  return esc(v);
}
function execute() {
  const sql = $('#sql').value; state.sql = sql; const out = $('#results');
  try {
    const q = sql.trim();
    if (!q) throw new SqlError('Escreva uma consulta primeiro.');
    if (!/^select\b/i.test(q)) throw new SqlError('Na delegacia só é permitido consultar (SELECT). Ninguém altera as provas!');
    const r = runSQL(state.db, q);
    if (!r.rows.length) { out.innerHTML = '<p class="note">Consulta executada: 0 linhas. Nenhum registro bate com esses filtros.</p>'; return; }
    const MAX = 200, rows = r.rows.slice(0, MAX);
    out.innerHTML = `<div class="rescount">${r.rows.length} linha${r.rows.length > 1 ? 's' : ''}${r.rows.length > MAX ? ` (mostrando as primeiras ${MAX})` : ''}</div>
      <div class="tablewrap"><table><thead><tr>${r.cols.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(v => `<td>${fmt(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  } catch (e) { out.innerHTML = `<div class="err"><b>${e instanceof SqlError ? 'Erro na consulta' : 'Erro inesperado'}</b><br>${esc(e.message)}</div>`; }
}
async function accuse() {
  const v = $('#accuse').value.trim(), msg = $('#accMsg'), btn = $('#btnAccuse');
  if (!v) { msg.className = 'accmsg bad'; msg.textContent = 'Digite o nome de um suspeito.'; return; }
  btn.disabled = true; msg.className = 'accmsg'; msg.textContent = 'Levando a acusação ao promotor…';
  try {
    const r = await api('accuse', { case_id: state.c.id, name: v, hints: state.hintTexts.length, wrongs: state.wrongs });
    if (r.correct) {
      if (logged()) state.progress[state.c.id] = { xp: r.best };
      else { const prev = guest.done[state.c.id]; guest.done[state.c.id] = { xp: Math.max(r.xp, prev ? prev.xp : 0) }; saveGuest(); }
      renderHeader(); showVictory(r);
    } else {
      state.wrongs = r.wrongs; renderHints();
      msg.className = 'accmsg bad'; msg.textContent = `"${v}" foi liberado por falta de provas. XP possível agora: ${r.potential}.`;
    }
  } catch (e) { msg.className = 'accmsg bad'; msg.textContent = e.message; }
  finally { btn.disabled = false; }
}
function showVictory(r) {
  const c = state.c, i = CASES.findIndex(x => x.i === c.i), dm = doneMap();
  const next = CASES.slice(i + 1).concat(CASES.slice(0, i)).find(x => !dm[x.id]);
  const m = document.createElement('div'); m.className = 'overlay'; m.id = 'ovl';
  m.innerHTML = `<div class="modal win"><div class="stamp ok">CASO ENCERRADO</div><h2>${esc(r.culpado)} foi preso!</h2>
    <p>${r.replay ? 'Você já tinha resolvido este caso; o XP guardado é o melhor resultado.' : `Você ganhou <b>+${r.xp} XP</b>.`} ${state.hintTexts.length ? `Dicas usadas: ${state.hintTexts.length}.` : 'Sem dicas, muito bom!'} ${state.wrongs ? `Acusações erradas: ${state.wrongs}.` : ''}</p>
    ${logged() ? '' : '<p class="note">Jogando como visitante: <b>crie uma conta</b> para guardar este XP e entrar no ranking.</p>'}
    <p class="note">Uma solução possível:</p><pre class="code">${esc(r.solucao)}</pre>
    <div class="row"><button class="btn ghost" data-close="home">Todos os casos</button>${next ? `<button class="btn primary" data-open="${next.i}">Próximo caso →</button>` : ''}</div></div>`;
  document.body.appendChild(m);
}
function showRef() {
  const R = [['Ver tudo', 'SELECT * FROM tabela;'], ['Colunas escolhidas', 'SELECT nome, hora FROM tabela;'], ['Filtrar', "WHERE sala = 'Cofre' AND hora >= '21:00'"], ['Ou / dentro de uma lista', "WHERE a = 1 OR b IN ('x','y')"], ['Intervalo', "WHERE hora BETWEEN '21:00' AND '22:00'"], ['Texto parcial', "WHERE texto LIKE '%chapéu%'"], ['Ordenar e limitar', 'ORDER BY valor DESC LIMIT 5'], ['Unir tabelas', 'FROM a JOIN b ON b.a_id = a.id'], ['Contar por grupo', 'SELECT x, COUNT(*) AS n FROM t GROUP BY x'], ['Filtrar grupos', 'GROUP BY x HAVING COUNT(*) >= 3'], ['Somar / média', 'SUM(valor), AVG(valor), MIN(...), MAX(...)'], ['Valores únicos', 'SELECT DISTINCT profissao FROM pessoas'], ['Subconsulta', 'WHERE id IN (SELECT pessoa_id FROM chaves)'], ['Excluir da lista', 'WHERE id NOT IN (SELECT pessoa_id FROM alibis)'], ['Mesma tabela 2x', 'FROM encontros a JOIN encontros b ON a.lugar = b.lugar']];
  modal(`<h2>Cola rápida de SQL</h2><div class="reflist">${R.map(r => `<div><b>${r[0]}</b><code>${esc(r[1])}</code></div>`).join('')}</div><div class="row"><button class="btn primary" data-close="x">Fechar</button></div>`);
}
function modal(inner) { closeOvl(); const m = document.createElement('div'); m.className = 'overlay'; m.id = 'ovl'; m.innerHTML = `<div class="modal">${inner}</div>`; document.body.appendChild(m); return m; }
const closeOvl = () => { const o = $('#ovl'); if (o) o.remove(); };
function insertAtCursor(txt) { const ta = $('#sql'); if (!ta) return; const s = ta.selectionStart, e = ta.selectionEnd; ta.value = ta.value.slice(0, s) + txt + ta.value.slice(e); ta.selectionStart = ta.selectionEnd = s + txt.length; ta.focus(); state.sql = ta.value; }

/* ---------- CONTA ---------- */
let authMode = 'signup', pickedAvatar = AVATARS[0];
function showAuth(mode = 'signup', note = '') {
  authMode = mode;
  if (!sb) { modal(`<h2>Contas indisponíveis</h2><p>O servidor ainda não foi configurado: falta a chave pública do Supabase no arquivo do jogo.</p><div class="row"><button class="btn primary" data-close="x">Ok</button></div>`); return; }
  const su = mode === 'signup';
  modal(`<div class="authtabs"><button class="${su ? 'on' : ''}" data-authmode="signup">Criar conta</button><button class="${su ? '' : 'on'}" data-authmode="login">Entrar</button></div>
    <h2>${su ? 'Seu distintivo de detetive' : 'Bem-vindo de volta'}</h2>
    ${note ? `<p class="note">${esc(note)}</p>` : ''}
    <div class="form">
      ${su ? `<label>Apelido <small>(aparece no ranking · 3 a 20 caracteres)</small><input id="fNick" class="input" maxlength="20" autocomplete="nickname" placeholder="Ex.: Inspetor Select"></label>
      <div><span class="lbl">Avatar</span><div class="avgrid">${AVATARS.map(a => `<button type="button" class="avbtn ${a === pickedAvatar ? 'on' : ''}" data-av="${a}">${a}</button>`).join('')}</div></div>` : ''}
      <label>E-mail<input id="fMail" class="input" type="email" autocomplete="email" placeholder="voce@exemplo.com"></label>
      <label>Senha<input id="fPass" class="input" type="password" autocomplete="${su ? 'new-password' : 'current-password'}" placeholder="mínimo 6 caracteres"></label>
      <div id="authMsg" class="accmsg" role="status"></div>
      <button class="btn primary" id="btnAuth">${su ? 'Criar conta' : 'Entrar'}</button>
      ${su ? '' : '<button class="linkbtn" id="btnForgot">Esqueci minha senha</button>'}
      <button class="linkbtn" data-close="x">Continuar como visitante</button>
    </div></div>`);
}
const authSay = (t, bad = true) => { const m = $('#authMsg'); if (m) { m.className = 'accmsg' + (bad ? ' bad' : ' okmsg'); m.textContent = t; } };
async function doAuth() {
  const email = $('#fMail').value.trim(), pass = $('#fPass').value, btn = $('#btnAuth');
  if (!email || !pass) return authSay('Preencha e-mail e senha.');
  btn.disabled = true;
  try {
    if (authMode === 'signup') {
      const nick = $('#fNick').value.trim();
      if (!NICK_RE.test(nick)) { btn.disabled = false; return authSay('Apelido: de 3 a 20 letras, números, espaço, ponto, hífen ou _.'); }
      const ok = await sb.rpc('nickname_available', { n: nick });
      if (ok.data === false) { btn.disabled = false; return authSay('Esse apelido já está em uso. Escolha outro.'); }
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { nickname: nick, avatar: pickedAvatar }, emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (!data.session) { modal(`<h2>Confirme seu e-mail</h2><p>Enviamos um link para <b>${esc(email)}</b>. Clique nele para ativar sua conta e depois volte aqui para entrar.</p><p class="note">Não achou? Olhe a caixa de spam.</p><div class="row"><button class="btn primary" data-close="x">Entendi</button></div>`); return; }
      closeOvl();
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      closeOvl();
    }
  } catch (e) { authSay(authMsg(e)); btn.disabled = false; }
}
async function forgot() {
  const email = $('#fMail').value.trim(); if (!email) return authSay('Digite seu e-mail acima primeiro.');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  error ? authSay(authMsg(error)) : authSay('Se este e-mail tiver conta, enviamos um link para redefinir a senha.', false);
}
function showNewPassword() {
  modal(`<h2>Nova senha</h2><div class="form"><label>Nova senha<input id="fNew" class="input" type="password" autocomplete="new-password"></label><div id="authMsg" class="accmsg"></div><button class="btn primary" id="btnNewPass">Salvar senha</button></div>`);
}
async function showProfile() {
  const p = state.profile || {}; pickedAvatar = p.avatar || AVATARS[0];
  const solved = Object.keys(state.progress).length;
  modal(`<h2>${esc(p.avatar || '🕵️')} ${esc(p.nickname || '')}</h2>
    <p class="note">${esc(state.session?.user?.email || '')}</p>
    <p><b>${rankInfo().name}</b> · ${totalXP()} XP · ${solved}/${CASES.length} casos</p>
    <div class="form"><label>Apelido<input id="fNick" class="input" maxlength="20" value="${esc(p.nickname || '')}"></label>
    <div><span class="lbl">Avatar</span><div class="avgrid">${AVATARS.map(a => `<button type="button" class="avbtn ${a === pickedAvatar ? 'on' : ''}" data-av="${a}">${a}</button>`).join('')}</div></div>
    <div id="authMsg" class="accmsg"></div>
    <button class="btn primary" id="btnSaveProfile">Salvar perfil</button>
    <button class="btn ghost" id="btnBoard2">🏆 Ver ranking</button>
    <button class="btn ghost" id="btnLogout">Sair da conta</button></div>`);
}
async function saveProfile() {
  const nick = $('#fNick').value.trim();
  if (!NICK_RE.test(nick)) return authSay('Apelido: de 3 a 20 letras, números, espaço, ponto, hífen ou _.');
  const { error } = await sb.from('profiles').update({ nickname: nick, avatar: pickedAvatar }).eq('id', state.session.user.id);
  if (error) return authSay(error.code === '23505' ? 'Esse apelido já está em uso.' : authMsg(error));
  state.profile = { nickname: nick, avatar: pickedAvatar }; renderHeader(); authSay('Perfil atualizado!', false);
}
async function loadAccount() {
  const uid = state.session.user.id;
  for (let t = 0; t < 3 && !state.profile; t++) {
    const { data } = await sb.from('profiles').select('nickname,avatar').eq('id', uid).maybeSingle();
    if (data) state.profile = data; else await new Promise(r => setTimeout(r, 600));
  }
  const { data } = await sb.from('progress').select('case_id,xp');
  state.progress = {}; (data || []).forEach(r => state.progress[r.case_id] = { xp: r.xp });
}
async function onSession(session) {
  state.session = session; state.profile = null; state.progress = {};
  if (session && sb) { try { await loadAccount(); } catch (e) { console.error(e); } }
  renderHeader();
  if (state.view === 'home') renderHome(); else if (state.view === 'board') renderBoard();
}

/* ---------- eventos ---------- */
let noteTimer;
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, .overlay'); if (!t) return;
  if (t.classList.contains('overlay')) { if (ev.target === t) closeOvl(); return; }
  if (t.dataset.filter !== undefined) { state.filter = t.dataset.filter; renderHome(); return; }
  if (t.dataset.case !== undefined) { openCase(+t.dataset.case); return; }
  if (t.dataset.open !== undefined) { closeOvl(); openCase(+t.dataset.open); return; }
  if (t.dataset.close !== undefined) { closeOvl(); if (t.dataset.close === 'home') renderHome(); return; }
  if (t.dataset.peek) { $('#sql').value = `SELECT * FROM ${t.dataset.peek};`; execute(); return; }
  if (t.dataset.ins) { insertAtCursor(t.dataset.ins); return; }
  if (t.dataset.authmode) { showAuth(t.dataset.authmode); return; }
  if (t.dataset.av) { pickedAvatar = t.dataset.av; document.querySelectorAll('.avbtn').forEach(b => b.classList.toggle('on', b.dataset.av === pickedAvatar)); return; }
  switch (t.id) {
    case 'btnBack': renderHome(); break;
    case 'btnRun': execute(); break;
    case 'btnClear': $('#sql').value = ''; $('#sql').focus(); break;
    case 'btnRef': case 'btnRef2': showRef(); break;
    case 'btnHint': askHint(); break;
    case 'btnAccuse': accuse(); break;
    case 'btnTheme': toggleTheme(); break;
    case 'btnBoard': renderBoard(); break;
    case 'btnBoard2': closeOvl(); renderBoard(); break;
    case 'btnLogin': case 'btnLogin2': showAuth('signup'); break;
    case 'btnUser': showProfile(); break;
    case 'btnAuth': doAuth(); break;
    case 'btnForgot': forgot(); break;
    case 'btnSaveProfile': saveProfile(); break;
    case 'btnLogout': closeOvl(); sb.auth.signOut(); break;
    case 'btnNewPass': (async () => { const { error } = await sb.auth.updateUser({ password: $('#fNew').value }); error ? authSay(authMsg(error)) : (closeOvl()); })(); break;
    case 'btnResetGuest': if (confirm('Apagar seu progresso de visitante?')) { guest = { done: {}, notes: {}, theme: guest.theme }; saveGuest(); renderHome(); } break;
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'search') { state.q = ev.target.value; const p = ev.target.selectionStart; renderHome(); const s = $('#search'); s.focus(); s.setSelectionRange(p, p); }
  if (ev.target.id === 'notes' && state.c) {
    const body = ev.target.value, id = state.c.id; state.notes = body;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(async () => {
      if (logged() && sb) await sb.from('notes').upsert({ user_id: state.session.user.id, case_id: id, body, updated_at: new Date().toISOString() });
      else { guest.notes[id] = body; saveGuest(); }
    }, 900);
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeOvl();
  if (ev.target.id === 'sql') {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') { ev.preventDefault(); execute(); }
    if (ev.key === 'Tab') { ev.preventDefault(); insertAtCursor('  '); }
  }
  if (ev.target.id === 'accuse' && ev.key === 'Enter') accuse();
  if ((ev.target.id === 'fPass' || ev.target.id === 'fMail') && ev.key === 'Enter') doAuth();
});
function applyTheme() { if (guest.theme) document.documentElement.setAttribute('data-theme', guest.theme); }
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  guest.theme = cur === 'dark' ? 'light' : 'dark'; applyTheme(); saveGuest();
}
applyTheme(); renderHome();
if (sb) {
  sb.auth.onAuthStateChange((event, session) => {
    setTimeout(() => {   // evita travar o cliente do Supabase dentro do callback
      if (event === 'PASSWORD_RECOVERY') showNewPassword();
      if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'SIGNED_OUT' || event === 'USER_UPDATED') {
        if (event === 'SIGNED_IN' && state.session?.user?.id === session?.user?.id) return;
        onSession(session);
      }
    }, 0);
  });
}

</script>
</body>
</html>
